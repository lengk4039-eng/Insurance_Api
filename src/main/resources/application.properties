vaadin.launch-browser=true
spring.application.name=api
server.port=8081

# SQL Server Datasource
spring.datasource.url=jdbc:sqlserver://NAT-KIMLENG:1433;databaseName=Insurance;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sqlserver123!@#
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Explicit Dialect Fix
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.security.user.name=admin
spring.security.user.password=123456
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
vaadin.url-mapping=/*
# Enable HikariCP connection pool logging
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# PlasGate SMS Gateway (SMPP & API > SMS Gateway > API Keys in the PlasGate dashboard).
# Set these via environment variables rather than editing this file, since it's committed to the repo:
# PLASGATE_PRIVATE_KEY, PLASGATE_SECRET_KEY, PLASGATE_SENDER_ID
plasgate.base-url=${PLASGATE_BASE_URL:https://cloudapi.plasgate.com/rest/batch-send}
plasgate.private-key=${PLASGATE_PRIVATE_KEY:}
plasgate.secret-key=${PLASGATE_SECRET_KEY:}
plasgate.sender-id=${PLASGATE_SENDER_ID:Insurance}