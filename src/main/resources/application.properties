vaadin.launch-browser=true
spring.application.name=api
server.port=8081

# SQL Server Datasource
spring.datasource.url=jdbc:sqlserver://NAT-KIMLENG:1433;databaseName=Insurance;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sqlserver123!@#
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Explicit Dialect Fix
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none

# Without this, Hibernate silently rewrites every @Column(name = "...") to
# snake_case (e.g. CreatedAt -> created_at) before querying, which does not
# match this database's actual PascalCase column names and breaks every
# query against Users with "Invalid column name". This makes Hibernate use
# @Column names exactly as written instead.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.security.user.name=admin
spring.security.user.password=123456
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
vaadin.url-mapping=/*
# Enable HikariCP connection pool logging
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG